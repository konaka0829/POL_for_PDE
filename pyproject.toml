[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pol-pde-surrogate"
version = "0.1.0"
description = "Paper 1 surrogate-PDE feature maps for PDE operator learning"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.23",
    "scipy>=1.9",
    "h5py>=3.8",
    "matplotlib>=3.7",
]

[project.scripts]
pol = "pol.cli:main"

[project.optional-dependencies]
test = ["pytest>=7.0", "build>=1.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pol*"]
